name: Keep Supabase awake

# Supabase's free plan pauses a project that has had no activity for about a week.
# This asks the database for one public row every day so that never happens.
# If the database ever stops answering (paused, deleted, wrong key), this job fails
# and GitHub emails the repository owner: an early warning, not just a ping.
# It only reads public data, using the same public key the website itself uses.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the database for one row
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' assets/js/config.js | head -1)
          KEY=$(sed -n 's/.*supabaseAnonKey: *"\([^"]*\)".*/\1/p' assets/js/config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Could not read the Supabase address and key from assets/js/config.js"; exit 1; fi
          BODY=$(mktemp)
          CODE=$(curl -sS -m 30 -o "$BODY" -w "%{http_code}" "$URL/rest/v1/competitions_public?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $CODE"
          if [ "$CODE" != "200" ]; then cat "$BODY"; echo; echo "The database did not answer properly. It may be paused: open the Supabase dashboard and press Restore."; exit 1; fi
          if ! grep -q '^\[' "$BODY"; then cat "$BODY"; echo; echo "Unexpected answer from the database."; exit 1; fi
          echo "OK: the database is awake."
